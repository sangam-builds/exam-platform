name: Deploy Student App (Staging)

on:
  push:
    branches: [develop]
    paths:
      - 'apps/student-app/**'
      - 'packages/**'
      - '.github/workflows/deploy-student-app.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Student App to Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Echo Deploy Notice
        run: echo "Student App staging deployment pipeline ready."
